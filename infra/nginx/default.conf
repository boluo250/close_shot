limit_req_zone $binary_remote_addr zone=per_ip_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    client_max_body_size 20m;
    limit_req_status 429;
    limit_req zone=per_ip_rate burst=60 nodelay;
    limit_conn per_ip_conn 40;

    # Drop common internet scanner probes before they hit upstream.
    location ~* ^/(?:admin|login|wp-admin|wp-login\.php|webfig|console|phpmyadmin|jenkins|manager|jasperserver(?:pro|test)?|sici\.cgi|actuator|api/session/properties|inventry|\.env|\.git)(?:/|$|\.|-) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # Admin web SPA entry
    location = / {
        return 302 /ops-x8r7m2q4p9/login;
    }

    # Admin web routes
    location ^~ /ops-x8r7m2q4p9 {
        proxy_pass http://admin-web:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API routes: must be matched before the generic scanner-block regex,
    # otherwise /admin-x8r7m2q4p9/* will be mistaken for probe traffic and get dropped with 444.
    location ^~ /admin-x8r7m2q4p9 {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite build assets (default dist output)
    location ^~ /assets/ {
        proxy_pass http://admin-web:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

name: backend-smoke

on:
  pull_request:
    paths:
      - ".github/workflows/backend-smoke.yml"
      - "backend/**"
  push:
    paths:
      - ".github/workflows/backend-smoke.yml"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run smoke tests
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET: ci-jwt-secret
          MEMBERSHIP_CALLBACK_SECRET: test-membership-secret
        run: python -m pytest tests/test_smoke.py

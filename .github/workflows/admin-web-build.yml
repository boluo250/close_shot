name: admin-web-build

on:
  pull_request:
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "admin-web/**"
  push:
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "admin-web/**"
  workflow_dispatch:

concurrency:
  group: admin-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin web
        run: npm run build

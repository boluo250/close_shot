[alembic]
script_location = alembic
prepend_sys_path = .

; NOTE:
; `alembic` 使用 configparser 读取此值，`%(...)s` 会被当作 ini 内插值而不是环境变量，
; 可能导致 `InterpolationMissingOptionError`。
; 实际迁移时连接串由 `alembic/env.py` 动态注入（优先读环境变量 DATABASE_URL，其次读 backend/.env）。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

